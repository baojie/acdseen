[project]
name = "acdseen"
version = "0.1.0"
description = "A remake of ACDSee 1.2x (1996): one browser, one viewer, and fast is the whole point"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
# Only as a fallback for PCX / PCD / PSD and other old formats Qt doesn't know
legacy = ["Pillow>=10"]

[project.urls]
Homepage = "https://github.com/baojie/acdseen"
Changelog = "https://github.com/baojie/acdseen/blob/main/CHANGELOG.md"

[project.scripts]
acdseen = "acdseen.main:main"

[build-system]
requires = ["setuptools>=77"]   # PEP 639 string-form license = "MIT" needs 77+
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["acdseen"]
